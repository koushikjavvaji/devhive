<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>devhive — war room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🐝</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header>
    <a href="/" class="brand"><h1>🐝 devhive</h1></a>
    <span id="status" class="status"></span>
  </header>

  <section id="rooms-view" hidden>
    <div class="rooms-toolbar">
      <button id="new-room">+ New war room</button>
    </div>
    <ul id="rooms-list"></ul>
  </section>

  <section id="chat-view" hidden>
    <main id="messages"></main>
    <form id="composer">
      <div class="composer-main">
        <input id="name" type="text" maxlength="24" placeholder="your name (optional)" autocomplete="nickname">
        <textarea id="input" placeholder="Throw a bug in — paste an error or stack trace…" rows="3" maxlength="8000"></textarea>
      </div>
      <button type="submit">Throw it in</button>
    </form>
  </section>
</div>
<!-- pinned exact versions + integrity hashes: if the CDN ever served something else, the
     browser refuses to run it (and app.js falls back to its plain-text renderer) -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
        integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
        integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
        crossorigin="anonymous"></script>
<script src="/static/app.js"></script>
</body>
</html>
