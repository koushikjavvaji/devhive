<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>devhive — war room</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header>
    <a href="/" class="brand"><h1>🐝 devhive</h1></a>
    <span id="status" class="status"></span>
  </header>

  <section id="rooms-view" hidden>
    <div class="rooms-toolbar">
      <button id="new-room">+ New war room</button>
    </div>
    <ul id="rooms-list"></ul>
  </section>

  <section id="chat-view" hidden>
    <main id="messages"></main>
    <form id="composer">
      <textarea id="input" placeholder="Throw a bug in — paste an error or stack trace…" rows="3"></textarea>
      <button type="submit">Throw it in</button>
    </form>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
